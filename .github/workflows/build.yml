name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Test native multiline highlights
        run: scripts/tests/test-highlight-geometry.sh
      - name: Test highlight window lifecycle
        run: scripts/tests/test-highlight-panel.sh
      - name: Test refinement keyboard and focus
        run: scripts/tests/test-refinement-panel.sh
      - name: Test release feed generation
        run: python3 scripts/tests/test_update_appcast.py
      - name: Build universal app
        run: scripts/build.sh --universal
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Lacuna.app dist/Lacuna-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lacuna-universal
          path: dist/Lacuna-universal.zip
          if-no-files-found: error
